[project]
name = "cv-agentic-mlops"
version = "0.1.0"
description = "Reusable agentic computer-vision training & evaluation framework: Strands orchestration over Amazon SageMaker"
requires-python = ">=3.11"
# Application/orchestration layer only. The training container has its own,
# heavier dependency set under training/pyproject.toml.
dependencies = [
    "strands-agents>=1.0",
    "strands-agents-tools>=0.1",
    "boto3>=1.34",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.scripts]
cv-mlops = "cli:main"

[project.optional-dependencies]
# Needed only when building/starting SageMaker pipelines locally.
sagemaker = ["sagemaker>=2.220,<3"]  # v3 removed Estimator/Processor/workflow APIs
# Local dataset generation + tests.
dev = ["pytest>=8.0", "pillow>=10.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
